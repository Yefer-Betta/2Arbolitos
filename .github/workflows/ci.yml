name: CI — lint, build y tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: 2arbolitos_segura_2024
          MYSQL_DATABASE: 2arbolitos
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -p2arbolitos_segura_2024"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar dependencias (raíz)
        run: npm ci

      - name: Instalar dependencias (server)
        working-directory: server
        run: npm ci

      - name: Generar cliente Prisma
        working-directory: server
        run: npx prisma generate

      - name: Validar esquema Prisma
        working-directory: server
        env:
          DATABASE_URL: mysql://root:2arbolitos_segura_2024@localhost:3306/2arbolitos?schema=public
        run: npx prisma validate

      - name: Ejecutar lint (raíz)
        run: npm run lint

      - name: Ejecutar build (frontend)
        run: npm run build

      - name: Ejecutar tests (Vitest)
        run: npm test
