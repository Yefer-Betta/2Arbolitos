name: Windows portable y MSI

# Empaqueta el ZIP portable y el MSI, y los adjunta a la release del tag.
# Se dispara solo al empujar un tag v* o a mano desde Actions.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag a empaquetar (ej. v1.1.1)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  portable:
    runs-on: windows-latest

    steps:
      - name: Checkout del tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Dependencias del frontend
        run: npm ci

      - name: Dependencias del backend (produccion)
        run: npm ci --omit=dev --prefix server

      - name: Generar Prisma Client
        working-directory: server
        run: npx prisma generate

      - name: Compilar frontend
        run: npm run build

      - name: Empaquetar MSI y ZIP portable con MariaDB
        run: node scripts/pack-msi.js --skip-build --system-node

      - name: Generar SHA256 del ZIP
        shell: pwsh
        run: |
          $zip = Get-ChildItem release/2Arbolitos-Portable-Windows-x64-*.zip | Select-Object -First 1
          $hash = Get-FileHash -Algorithm SHA256 -Path $zip.FullName | Select-Object -ExpandProperty Hash
          $hash | Out-File -FilePath ($zip.FullName + '.sha256') -Encoding utf8

      - name: Adjuntar ZIP y MSI a la release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: |
            release/2Arbolitos-Portable-Windows-x64-*.zip
            release/2Arbolitos-Portable-Windows-x64-*.zip.sha256
            release/2Arbolitos-Windows-x64-*.msi
            release/2Arbolitos-Windows-x64-*.msi.sha256
          fail_on_unmatched_files: true
          overwrite_files: true
